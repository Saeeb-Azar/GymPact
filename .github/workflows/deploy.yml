# Automatisches Deployment bei jedem Push auf den Live-Branch:
#   1. Tests + Build (Supabase-URL/-Key kommen aus .env.production)
#   2. Datenbank: neue Migrationen in Supabase einspielen   (Secret SUPABASE_DB_PASSWORD oder SUPABASE_DB_URL)
#   3. Supabase-Auth: Website-URL eintragen                 (Secret SUPABASE_ACCESS_TOKEN, optional)
#   4. Fertige Website in den Branch "hostinger-build" legen (für Hostinger-Git)
#   5. Optional per FTP direkt nach Hostinger hochladen     (Secrets FTP_SERVER/FTP_USERNAME/FTP_PASSWORD)
# Fehlt ein Secret, wird der jeweilige Schritt übersprungen.

name: Deploy

on:
  push:
    branches: [claude/neues-projekt-q6ro6k]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://lightsteelblue-otter-468534.hostingersite.com' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: |
          npm run build
          find dist -name '*.map' -delete

      - name: Datenbank-Migrationen (Supabase)
        if: env.SUPABASE_DB_URL != '' || env.SUPABASE_DB_PASSWORD != ''
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          if [ -z "$SUPABASE_DB_URL" ]; then
            REF=$(grep '^VITE_SUPABASE_URL=' .env.production | sed -E 's#.*https://([^.]+)\..*#\1#')
            SUPABASE_DB_URL=$(scripts/find-db-url.sh "$REF")
            echo "::add-mask::$SUPABASE_DB_URL"
            export SUPABASE_DB_URL
          fi
          scripts/db-migrate.sh

      - name: Supabase-Auth konfigurieren (Website-URL, Google-Login, keine Bestätigungsmail)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        continue-on-error: true
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          REF=$(grep '^VITE_SUPABASE_URL=' .env.production | sed -E 's#.*https://([^.]+)\..*#\1#')
          BODY=$(python3 - <<'PY'
          import json, os
          site = os.environ["SITE_URL"].rstrip("/")
          body = {"site_url": site, "uri_allow_list": f"{site}/**", "mailer_autoconfirm": True}
          if os.environ.get("GOOGLE_CLIENT_ID") and os.environ.get("GOOGLE_CLIENT_SECRET"):
              body.update(external_google_enabled=True,
                          external_google_client_id=os.environ["GOOGLE_CLIENT_ID"],
                          external_google_secret=os.environ["GOOGLE_CLIENT_SECRET"])
          print(json.dumps(body))
          PY
          )
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" -o /dev/null && echo "Auth-Einstellungen gesetzt für $REF"

      - name: Website in Branch "hostinger-build" veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-build
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Build'

      - name: Per FTP zu Hostinger hochladen
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
